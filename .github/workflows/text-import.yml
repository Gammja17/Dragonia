# text/dialogue.csv 를 고쳐서 올리면 JS 파일에 자동으로 되돌려 쓰고, 그 커밋이 다시 Pages 로 배포된다.
name: 대사 시트 반영
on:
  push:
    branches: [main]
    paths: ['text/dialogue.csv']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node tools/text-import.mjs
      - run: node tools/text-export.mjs
      - name: 커밋
        run: |
          git config user.name 'dialogue-sheet'
          git config user.email 'dialogue-sheet@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m '대사 시트에서 반영'
          git push
