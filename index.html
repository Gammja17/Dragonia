<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragonia: The Origin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background-color: #050505;
            overflow: hidden;
            font-family: 'Fredoka', 'Noto Sans KR', sans-serif;
            touch-action: none; user-select: none;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        /* HUD PANEL */
        .hud-panel {
            position: absolute; top: 20px; left: 20px;
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(12px);
            padding: 20px; border-radius: 20px;
            color: white; border: 1px solid rgba(255,255,255,0.1);
            width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.2s, opacity 0.2s;
            pointer-events: auto;
        }
        .hud-panel:hover { background: rgba(20, 20, 30, 0.8); }

        .hud-collapsed {
            display: none;
        }

        #hud-show-btn {
            position: absolute; top: 20px; left: 20px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 0.8rem;
            cursor: pointer;
            pointer-events: auto;
            display: none;
            z-index: 50;
        }
        #hud-show-btn:hover {
            background: rgba(255,255,255,0.12);
        }

        .stat-group { margin-bottom: 15px; }
        .stat-header { display: flex; justify-content: space-between; font-size: 0.9rem; color: #aab; margin-bottom: 6px; font-weight: 600; letter-spacing: 1px;}
        
        .progress-track {
            width: 100%; height: 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px; overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        .progress-fill { height: 100%; border-radius: 10px; transition: width 0.3s ease-out; }
        
        .xp-bar { background: linear-gradient(90deg, #a55eea, #fed330); box-shadow: 0 0 10px #a55eea; }
        .hp-bar { background: linear-gradient(90deg, #ff5252, #ff793f); box-shadow: 0 0 10px #ff5252; }
        .hunger-bar { background: linear-gradient(90deg, #fa8231, #f7b731); box-shadow: 0 0 10px #fa8231; }

        .inv-slot {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 15px;
            font-size: 1rem; color: #fff; font-weight: bold; margin-top: 10px;
        }

        #raid-warning {
            position: absolute; top: 15%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ff3838; font-size: 3rem; font-weight: 900;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            display: none; letter-spacing: 5px;
            animation: shake 0.5s infinite;
            text-align: center; width: 100%; z-index: 20;
        }
        @keyframes shake {
            0% { transform: translate(-52%, -50%); }
            50% { transform: translate(-48%, -50%); }
            100% { transform: translate(-52%, -50%); }
        }

        #customizer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            pointer-events: auto; z-index: 100;
        }
        .card {
            background: rgba(255,255,255,0.05); padding: 40px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px); box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 20px; width: 350px;
        }
        .title-logo {
            font-size: 4rem; color: transparent; margin-bottom: 10px;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text; font-weight: 900; letter-spacing: -2px;
            text-shadow: 0 10px 30px rgba(0, 114, 255, 0.4);
        }
        button.start-btn {
            padding: 15px; font-size: 1.2rem; background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold;
            box-shadow: 0 5px 20px rgba(56, 239, 125, 0.4); transition: transform 0.2s;
        }
        button.start-btn:hover { transform: scale(1.05); }

        .quest-arrow {
            position: absolute; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.9); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            z-index: 5; transition: all 0.2s;
        }

        .interaction-prompt {
            position: absolute; background: rgba(0,0,0,0.7); color: #ffd700;
            padding: 5px 10px; border-radius: 10px; font-size: 12px;
            pointer-events: none; transform: translate(-50%, -100%);
            white-space: nowrap; border: 1px solid #ffd700; display: none; z-index: 150;
        }

        /* Dialogue / VN */
        #dialogue-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 35vh;
            background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.8));
            border-top: 3px solid #ffd700;
            display: none;
            flex-direction: column; justify-content: flex-start;
            padding: 30px 10%; box-sizing: border-box;
            z-index: 200; pointer-events: auto;
            backdrop-filter: blur(5px);
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        #d-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        #d-portrait { width: 60px; height: 60px; background: #333; border-radius: 50%; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        #d-name { color: #f1c40f; font-size: 1.8rem; font-weight: bold; text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
        #d-text { color: #ecf0f1; font-size: 1.2rem; line-height: 1.6; margin-bottom: 18px; min-height: 60px; text-shadow: 1px 1px 2px black; font-family: 'Noto Sans KR', sans-serif; }
        #d-options { display: flex; gap: 10px; flex-wrap: wrap; }
        .d-btn {
            background: rgba(255, 255, 255, 0.08); color: white; border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 20px; cursor: pointer; border-radius: 30px; font-size: 0.95rem;
            transition: all 0.15s; font-family: 'Noto Sans KR', sans-serif;
        }
        .d-btn:hover { background: rgba(255, 215, 0, 0.2); border-color: #ffd700; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        .controls-hint {
            position: absolute; bottom: 25px; left: 30px;
            color: rgba(255,255,255,0.5); font-size: 11px;
            text-transform: uppercase; letter-spacing: 1px;
            line-height: 1.6;
            pointer-events: none;
        }
        .key { color: #fff; font-weight: bold; border-bottom: 1px solid #555; }

        /* Kids panel (애 관리) */
        #kids-panel {
            position: absolute;
            bottom: 20px; right: 20px;
            width: 320px;
            max-height: 60vh;
            background: rgba(10,10,20,0.9);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            padding: 15px;
            color: #ecf0f1;
            display: none;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
            z-index: 60;
        }
        #kids-header {
            display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;
        }
        #kids-list {
            overflow-y:auto; padding-right:4px;
        }
        .kid-row {
            display:flex; align-items:center; justify-content:space-between;
            padding:6px 8px; border-radius:10px;
            background:rgba(255,255,255,0.04); margin-bottom:4px; font-size:0.9rem;
        }
        .kid-stage { font-size: 0.8rem; opacity: 0.7; }
        .kid-heart { color:#e74c3c; margin-left:4px; }

        #kids-toggle-btn {
            margin-top:10px;
            width:100%;
            padding:8px 0;
            border-radius:10px;
            border:1px solid rgba(255,255,255,0.25);
            background:rgba(0,0,0,0.4);
            color:#fff;
            font-size:0.9rem;
            cursor:pointer;
        }
        #kids-toggle-btn:hover {
            background:rgba(255,255,255,0.08);
        }

        #hud-collapse-btn {
            margin-top:10px;
            width:100%;
            padding:6px 0;
            border-radius:10px;
            border:1px solid rgba(255,255,255,0.25);
            background:rgba(255,255,255,0.08);
            color:#fff;
            font-size:0.85rem;
            cursor:pointer;
        }
        #hud-collapse-btn:hover {
            background:rgba(255,255,255,0.18);
        }

        .biome-badge {
            position: absolute; top: 30px; right: 30px; background: rgba(0,0,0,0.8); color: #ecf0f1; padding: 10px 20px; border-radius: 4px; font-weight: 600; letter-spacing: 1px; font-size: 0.9rem; border-left: 3px solid #2ecc71;
            pointer-events:auto;
        }
    </style>
</head>
<body>

    <div id="customizer">
        <h1 class="title-logo">DRAGONIA</h1>
        <p style="color:#aab; margin-bottom:40px; font-size:1.1rem;">THE ORIGIN UPDATE</p>
        
        <div class="card">
            <input type="text" id="c-name" value="Bahamut" style="padding:15px; border-radius:10px; border:none; background:rgba(0,0,0,0.3); color:white; font-size:1.2rem; text-align:center;">

            <div style="display:flex; justify-content:space-between; color:#ddd; align-items:center;">
                <span>Body Color</span> <input type="color" id="c-body" value="#3498db" style="background:none; border:none; width:40px; height:30px; cursor:pointer;">
            </div>
            <div style="display:flex; justify-content:space-between; color:#ddd; align-items:center;">
                <span>Belly Color</span> <input type="color" id="c-belly" value="#2980b9" style="background:none; border:none; width:40px; height:30px; cursor:pointer;">

            <button class="start-btn" id="start-btn">AWAKEN</button>

    <canvas id="gameCanvas"></canvas>
    
    <div id="raid-warning">⚔️ RAID INBOUND ⚔️</div>

    <div id="ui-layer" style="display:none;">
        <div class="biome-badge">
            <span id="biome-text">Wild Forest</span>

        <button id="hud-show-btn">▶ HUD</button>

        <div class="hud-panel" id="hud-panel">

                <div>
                    <div style="font-weight:bold; font-size:1.3rem; color:#fff;" id="ui-name">Player</div>
                    <div style="font-size:0.9rem; color:#a55eea;">LVL <span id="ui-lvl">1</span></div>

            </div>

            <div class="stat-group">
                <div class="stat-header"><span>HP</span> <span id="ui-hp-text">100</span></div>
                <div class="progress-track"><div id="bar-hp" class="progress-fill hp-bar" style="width:100%"></div></div>
            </div>

            <div class="stat-group">
                <div class="stat-header"><span>HUNGER</span></div>
                <div class="progress-track"><div id="bar-hunger" class="progress-fill hunger-bar" style="width:100%"></div></div>
            </div>

            <div class="inv-slot">
                <span>🍖 Meat:</span> <span id="ui-meat" style="color:#e67e22;">0</span>
            </div>

            <button id="kids-toggle-btn">🐣 애 관리 열기</button>
            <button id="hud-collapse-btn">◀ HUD 숨기기</button>

    </div>

    <!-- Kids panel -->
    <div id="kids-panel">
        <div id="kids-header">
            <div>🐣 애 관리</div>
            <button id="kids-close" style="background:none;border:none;color:#bdc3c7;cursor:pointer;font-size:0.8rem;">닫기</button>
        </div>
        <div style="font-size:0.75rem; color:#95a5a6; margin-bottom:6px;">

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// KIDS SYSTEM

// utils
const rand = (min,max)=>Math.random()*(max-min)+min;
const dist = (a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp = (a,b,t)=>a+(b-a)*t;
function shadeColor(color, percent) {
    let f=parseInt(color.slice(1),16),t=percent<0?0:255,p=percent<0?percent*-1:percent,R=f>>16,G=f>>8&0x00FF,B=f&0x0000FF;
    return "#"+(0x1000000+(Math.round((t-R)*p)+R)*0x10000+(Math.round((t-G)*p)+G)*0x100+(Math.round((t-B)*p)+B)).toString(16).slice(1);
}
function showToast(msg, icon='✨') {
    const n = document.createElement('div');
    n.style.cssText = "position:fixed; bottom:20%; left:50%; transform:translate(-50%); background:rgba(0,0,0,0.8); color:#ffd700; padding:10px 20px; border-radius:50px; font-weight:bold; animation:fade 3s forwards; pointer-events:none; white-space:nowrap; z-index:300;";
    n.innerHTML = `${icon} ${msg}`;
    document.body.appendChild(n);
    setTimeout(()=>n.remove(), 3000);
}
const style = document.createElement('style');
style.innerHTML = `@keyframes fade { 0% {opacity:0; transform:translate(-50%, 20px);} 10%{opacity:1; transform:translate(-50%,0);} 80%{opacity:1; transform:translate(-50%,-10px);} 100%{opacity:0; transform:translate(-50%,-30px);} }`;
document.head.appendChild(style);

    FOREST: { name: 'Wild Forest', color: '#27ae60', dot: '#2ecc71', safe: false }
};
function getBiome(x, y) {
    if (x > 800 && x < 1600 && y > 800 && y < 1600) return 'VILLAGE';
    if (dist({x,y}, {x:2000, y:2000}) < 600) return 'LAKE';

}

// CAMERA
let cam = {x:0,y:0,w:canvas.width,h:canvas.height};
function isOnScreen(e,m=200){
    return (e.x+m>cam.x && e.x-m<cam.x+cam.w && e.y+m>cam.y && e.y-m<cam.y+cam.h);
}

// BASE CLASS
class Entity {
    constructor(x,y){this.x=x;this.y=y;this.remove=false;}
    drawShadow(ctx,r){
        ctx.fillStyle='rgba(0,0,0,0.4)';
        ctx.beginPath();ctx.ellipse(0,0,r,r*0.4,0,0,Math.PI*2);ctx.fill();
    }
}

// DRAGON
class Dragon extends Entity {
    constructor(x,y,config,isPlayer=false){
        super(x,y);
        this.isPlayer = isPlayer;
        this.config = config;
        this.colors = {
            body: config.colors.body,
            bodyDark: shadeColor(config.colors.body,-0.3),
            wing: config.colors.wing,
            wingDark: shadeColor(config.colors.wing,-0.4),
            belly: config.colors.belly
        };
        this.species = config.species || 'WESTERN'; // WESTERN, WYVERN, EASTERN, BEHEMOTH

        this.level=1; this.hp=100; this.maxHp=100; this.xp=0; this.maxXp=100; this.hunger=100;
        this.angle=0; this.wingFrame=Math.random()*10; this.hoverY=0;
        this.inventory={meat:0}; this.carrying=null;

        this.homeX=x; this.homeY=y;
        this.state='WANDER'; this.timer=0;
        this.chatTimer = rand(5,15);
        this.currentChat = null; this.chatFade=0;
        this.hasEgg=false;
        this.relation=0;
    }

    gainXp(amount){
        this.xp += amount;
        if(this.xp >= this.maxXp){
            this.level++;
            this.xp -= this.maxXp;
            this.maxXp = Math.floor(this.maxXp*1.3);
            this.maxHp += 20;
            this.hp = this.maxHp;
            if(this.isPlayer){
                showToast(`LEVEL UP! LV.${this.level}`,'🔥');
                for(let i=0;i<25;i++) entities.particles.push(new Particle(this.x,this.y,'#f1c40f',1.2));
                limitParticles();
            }
        }
    }

    takeDamage(dmg){
        this.hp -= dmg;
        for(let i=0;i<5;i++) entities.particles.push(new Particle(this.x,this.y,'#e74c3c',0.8));
        limitParticles();
        if(this.hp<=0 && this.isPlayer){
            showToast("쓰러졌습니다... 마을에서 부활합니다.","💀");
            this.hp = this.maxHp; this.x=1200; this.y=1200;
        }
    }

    update(dt,input){
        if(this.chatFade>0) this.chatFade -= dt*0.3;
        this.hoverY = Math.sin(gameTime*2 + this.x*0.01)*10;

        if(this.isPlayer){
            if(isDialogueOpen) return;
            let dx=0,dy=0;
            if(input.keys['w'])dy=-1;
            if(input.keys['s'])dy=1;
            if(input.keys['a'])dx=-1;
            if(input.keys['d'])dx=1;
            let spd = 260*(input.keys['shift']?1.5:1);

            if(dx||dy){
                this.angle = Math.atan2(dy,dx);
                this.x += Math.cos(this.angle)*spd*dt;
                this.y += Math.sin(this.angle)*spd*dt;
                this.wingFrame += 16*dt;
                this.hunger -= 0.5*dt;
            }else{
                this.wingFrame += 5*dt;
                this.hunger -= 0.1*dt;
            }

            this.x = Math.max(50,Math.min(WORLD_SIZE-50,this.x));
            this.y = Math.max(50,Math.min(WORLD_SIZE-50,this.y));

            // Interaction - nearest NPC
            let nearestNPC = entities.npcs.find(n=>dist(this,n)<180);
            if(nearestNPC){
                interactTip.style.display='block';
                interactTip.style.left = (window.innerWidth/2 + (nearestNPC.x - cam.x)) + 'px';
                interactTip.style.top = (window.innerHeight/2 + (nearestNPC.y - cam.y) - 60) + 'px';
            }else{
                interactTip.style.display='none';
            }

            if(input.keys[' ']&&!input.prevKeys[' ']) this.attack();
            if(input.keys['e']&&!input.prevKeys['e']) this.interact();
            if(input.keys['t']&&!input.prevKeys['t']){ if(nearestNPC) startDialogue(nearestNPC,'TALK'); }
            if(input.keys['l']&&!input.prevKeys['l']){ if(nearestNPC) startDialogue(nearestNPC,'FLIRT'); }
            if(input.keys['k']&&!input.prevKeys['k']){ toggleKidsPanel(); }

            if(Math.random()<0.12) this.updateUI();
        }else{
            if(isDialogueOpen) return;
            this.chatTimer -= dt;
            if(this.chatTimer<=0){
                const lines = (DIALOGUES[this.config.personality] || {idle:[]}).idle || [];
                if(lines.length){
                    this.say(lines[Math.floor(Math.random()*lines.length)]);
                }
                this.chatTimer = rand(10,25);
            }

            // PARTNER_FOLLOW AI
            if(this.state === 'PARTNER_FOLLOW'){
                const d = dist(this, player);
                if(d>110){
                    this.angle = Math.atan2(player.y - this.y, player.x - this.x);
                    this.x += Math.cos(this.angle)*220*dt;
                    this.y += Math.sin(this.angle)*220*dt;
                    this.wingFrame += 14*dt;
                }else{
                    this.wingFrame += 7*dt;
                }

                // 파트너가 둥지까지 가서 알 낳기
                let nest = entities.nests[0];
                if(nest && !nest.hasEgg && dist(this,nest)<100 && kidsRegistry.length<MAX_KIDS){
                    nest.hasEgg = true; this.hasEgg=true;
                    this.state='WANDER';
                    this.say("우리 알을 부탁해.");
                    showToast(`${this.config.name}가 알을 낳았습니다!`,'🥚');
                    for(let i=0;i<20;i++) entities.particles.push(new Particle(nest.x,nest.y,'#fff',1));
                    limitParticles();
                }
            }else{
                // WANDER
                this.timer-=dt;
                if(this.timer<=0){
                    this.timer = rand(3,8);
                    this.angle = rand(0,Math.PI*2);
                }
                if(dist(this,{x:this.homeX,y:this.homeY})>500){
                    this.angle = Math.atan2(this.homeY-this.y,this.homeX-this.x);
                }
                this.x += Math.cos(this.angle)*60*dt;
                this.y += Math.sin(this.angle)*60*dt;
                this.wingFrame += 6*dt;
            }
        }

        this.x = Math.max(50,Math.min(WORLD_SIZE-50,this.x));
        this.y = Math.max(50,Math.min(WORLD_SIZE-50,this.y));
    }

    say(text){
        this.currentChat = text;
        this.chatFade = 3.0;
    }

    attack(){
        if(this.hunger<10){showToast("배가 너무 고파요!","😫");return;}
        this.hunger -= 2;
        entities.bullets.push(new Fireball(this.x,this.y,this.angle,this));
        if(entities.bullets.length>100) entities.bullets.splice(0,entities.bullets.length-100);
    }

    interact(){
        let picked=false;
        entities.items.forEach(i=>{
            if(dist(this,i)<60){
                if(i.type==='MEAT'){
                    this.inventory.meat++; i.remove=true; picked=true;
                    showToast("고기 획득!","🍖");
                }else if(i.type==='EGG' && !this.carrying){
                    this.carrying='EGG'; i.remove=true; picked=true;
                    showToast("알을 들었습니다.","🥚");
                }
            }
        });
        if(picked) return;

        // self eat
        if(this.inventory.meat>0 && this.hunger<90){
            this.inventory.meat--; this.hunger += 40; this.hp = Math.min(this.maxHp, this.hp+30);
            showToast("고기를 먹었습니다.","😋");
            return;
        }else if(this.inventory.meat>0){
            // feed baby
            let baby = entities.babies.find(b=>dist(this,b)<80);
            if(baby){
                this.inventory.meat--;
                baby.grow();
                return;
            }else{
                showToast("배가 너무 불러요!","✋");
            }
        }

        // nest drop egg
        let nest = entities.nests.find(n=>dist(this,n)<80);
        if(nest && this.carrying==='EGG' && !nest.hasEgg){
            if(kidsRegistry.length>=MAX_KIDS){
                showToast("둥지가 꽉 찼습니다! 더 이상 알을 둘 수 없어요.","😅");
                return;
            }
            this.carrying=null;
            nest.hasEgg=true;
            showToast("알을 둥지에 안착시켰습니다.","🏠");
            return;
        }
    }

    updateUI(){
        const b = BIOMES[getBiome(this.x,this.y)];
        document.getElementById('biome-text').innerText = b.name;
        document.getElementById('ui-meat').innerText = this.inventory.meat;
        document.getElementById('ui-lvl').innerText = this.level;
        document.getElementById('ui-hp-text').innerText = this.hp.toFixed(0);
        document.getElementById('ui-xp-text').innerText = Math.floor((this.xp/this.maxXp)*100)+'%';

        document.getElementById('bar-hp').style.width = `${(this.hp/this.maxHp)*100}%`;
        document.getElementById('bar-hunger').style.width = `${Math.max(0,Math.min(100,this.hunger))}%`;
        document.getElementById('bar-xp').style.width = `${(this.xp/this.maxXp)*100}%`;

        document.getElementById('ui-name').innerText = this.config.name || 'Player';
        document.getElementById('ui-partner').innerText = playerPartner ? playerPartner.config.name : '없음';
    }

    draw(ctx){
        if(!isOnScreen(this)) return;
        ctx.save();
        ctx.translate(this.x, this.y + this.hoverY);
        let scale = this.isPlayer ? 1.05 : 0.9;
        ctx.scale(scale,scale);
        this.drawShadow(ctx,35);
        ctx.rotate(this.angle);

        const s = this.species;
        const c = this.colors;
        const f = Math.sin(this.wingFrame)*0.6;

        if(s==='EASTERN'){
            // 긴 몸 (동양 용)
            ctx.fillStyle = c.body;
            let segCount = 7;
            for(let i=0;i<segCount;i++){
                const t = i/segCount;
                const sway = Math.sin(this.wingFrame*0.5 + i)*15;
                ctx.beginPath();
                ctx.ellipse(-25 - i*22, sway, 18 - i*1.3, 14, 0, 0, Math.PI*2);
                ctx.fill();
            }
            // 머리
            ctx.fillStyle = c.bodyDark;
            ctx.beginPath(); ctx.ellipse(15,0,22,16,0,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#fff';
            ctx.beginPath(); ctx.arc(20,-5,4,0,Math.PI*2); ctx.arc(20,5,4,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#000';
            ctx.beginPath(); ctx.arc(22,-5,2,0,Math.PI*2); ctx.arc(22,5,2,0,Math.PI*2); ctx.fill();
            // 수염
            ctx.strokeStyle='#f1c40f'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.moveTo(25,-8); ctx.quadraticCurveTo(40,-15,45,-5); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(25,8); ctx.quadraticCurveTo(40,15,45,5); ctx.stroke();
        }else if(s==='WYVERN'){
            // 큼직한 날개
            ctx.save();
            ctx.fillStyle = c.wing;
            ctx.globalAlpha = 0.9;
            ctx.scale(1, 1+f*0.4);
            ctx.beginPath(); ctx.moveTo(-5,0); ctx.quadraticCurveTo(-70,-70,10,-35); ctx.quadraticCurveTo(40,-10,-5,0); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-5,0); ctx.quadraticCurveTo(-70,70,10,35); ctx.quadraticCurveTo(40,10,-5,0); ctx.fill();
            ctx.restore();

            // 몸통
            ctx.fillStyle=c.body;
            ctx.beginPath(); ctx.ellipse(0,0,26,16,0,0,Math.PI*2); ctx.fill();
            // 꼬리
            ctx.beginPath(); ctx.moveTo(-15,0); ctx.quadraticCurveTo(-55,10,-80,0); ctx.lineTo(-72,-4); ctx.lineTo(-55,-2); ctx.fill();
            // 머리
            ctx.fillStyle=c.bodyDark;
            ctx.beginPath(); ctx.ellipse(30,0,16,12,0,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#fff';
            ctx.beginPath(); ctx.arc(34,-4,4,0,Math.PI*2); ctx.arc(34,4,4,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#000';
            ctx.beginPath(); ctx.arc(36,-4,2,0,Math.PI*2); ctx.arc(36,4,2,0,Math.PI*2); ctx.fill();
        }else if(s==='BEHEMOTH'){
            // 거대한 몸
            ctx.fillStyle=c.wingDark;
            // 짧은 날개
            ctx.save();
            ctx.scale(1, 1+f*0.3);
            ctx.beginPath(); ctx.ellipse(-15,-25,20,14,0,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(-15,25,20,14,0,0,Math.PI*2); ctx.fill();
            ctx.restore();

            ctx.fillStyle=c.body;
            ctx.beginPath(); ctx.ellipse(0,0,32,22,0,0,Math.PI*2); ctx.fill();
            // 머리
            ctx.beginPath(); ctx.ellipse(32,0,18,14,0,0,Math.PI*2); ctx.fill();
            ctx.fillStyle=c.belly;
            ctx.beginPath(); ctx.ellipse(-4,0,18,12,0,0,Math.PI*2); ctx.fill();
            // 뿔
            ctx.fillStyle='#ecf0f1';
            ctx.beginPath(); ctx.moveTo(30,-10); ctx.lineTo(40,-24); ctx.lineTo(34,-4); ctx.fill();
            ctx.beginPath(); ctx.moveTo(30,10); ctx.lineTo(40,24); ctx.lineTo(34,4); ctx.fill();
            // 눈
            ctx.fillStyle='#fff';
            ctx.beginPath(); ctx.arc(34,-4,4,0,Math.PI*2); ctx.arc(34,4,4,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#000';
            ctx.beginPath(); ctx.arc(36,-4,2,0,Math.PI*2); ctx.arc(36,4,2,0,Math.PI*2); ctx.fill();
        }else{
            // WESTERN 기본 드래곤
            ctx.save();
            ctx.fillStyle=c.wing;
            ctx.globalAlpha = 0.95;
            ctx.scale(1.1,1+f*0.4);
            ctx.beginPath(); ctx.moveTo(-8,0); ctx.quadraticCurveTo(-65,-75,15,-30); ctx.quadraticCurveTo(50,-5,-8,0); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-8,0); ctx.quadraticCurveTo(-65,75,15,30); ctx.quadraticCurveTo(50,5,-8,0); ctx.fill();
            ctx.restore();

            ctx.fillStyle=c.body;
            ctx.beginPath(); ctx.ellipse(0,0,24,16,0,0,Math.PI*2); ctx.fill();
            ctx.fillStyle=c.belly;
            ctx.beginPath(); ctx.ellipse(0,0,14,10,0,0,Math.PI*2); ctx.fill();

            // 꼬리
            ctx.fillStyle=c.bodyDark;
            ctx.beginPath(); ctx.moveTo(-10,0); ctx.quadraticCurveTo(-55,-5,-85,0); ctx.lineTo(-70,8); ctx.lineTo(-50,5); ctx.fill();

            // 머리
            ctx.fillStyle=c.bodyDark;
            ctx.beginPath(); ctx.ellipse(30,0,18,12,0,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#fff';
            ctx.beginPath(); ctx.arc(34,-4,4,0,Math.PI*2); ctx.arc(34,4,4,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#000';
            ctx.beginPath(); ctx.arc(36,-4,2,0,Math.PI*2); ctx.arc(36,4,2,0,Math.PI*2); ctx.fill();
        }

        if(this.carrying==='EGG'){
            ctx.fillStyle='#fff';
            ctx.beginPath(); ctx.ellipse(0,-20,10,13,0,0,Math.PI*2); ctx.fill();
        }

        ctx.restore();

        // 이름 & 말풍선
        if(!this.isPlayer){
            ctx.save();
            ctx.translate(this.x, this.y-55);
            ctx.fillStyle='rgba(0,0,0,0.5)';
            ctx.fillRect(-45,-15,90,20);
            ctx.fillStyle='#fff';
            ctx.font='10px Fredoka';
            ctx.textAlign='center';
            ctx.fillText(this.config.name || 'Dragon',0,0);
            if(this.relation>0){
                ctx.fillStyle='#e74c3c';
                const hearts = Math.max(1,Math.ceil(this.relation/30));
                ctx.fillText('♥'.repeat(Math.min(3,hearts)),0,-18);
            }
            if(this.chatFade>0 && this.currentChat){
                ctx.globalAlpha = Math.min(1,this.chatFade);
                ctx.translate(0,-30);
                ctx.fillStyle='#fff';
                ctx.font='11px "Noto Sans KR"';
                const w = ctx.measureText(this.currentChat).width+24;
                const h = 26;
                roundRect(ctx,-w/2,-h/2,w,h,10);
                ctx.fillStyle='#333';
                ctx.fillText(this.currentChat,0,4);
            }
            ctx.restore();
        }
    }
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
    ctx.fill();
}

class Prop extends Entity{
    constructor(x,y,type){super(x,y);this.type=type;this.seed=Math.random();}
    draw(ctx){
        if(!isOnScreen(this,150))return;
        ctx.save(); ctx.translate(this.x,this.y);
        ctx.fillStyle='rgba(0,0,0,0.4)';
        ctx.beginPath();ctx.ellipse(0,0,this.type==='HOUSE'?50:20,this.type==='HOUSE'?20:8,0,0,6.28);ctx.fill();

        if(this.type==='TREE'){
            ctx.fillStyle='#3e2723'; ctx.fillRect(-5,-15,10,20);
            ctx.translate(0,-18);
            ctx.fillStyle=this.seed>0.5?'#16a085':'#1abc9c';
            ctx.beginPath();ctx.arc(0,0,25,0,6.28);ctx.fill();
        }else if(this.type==='HOUSE'){
            ctx.fillStyle='#2c3e50'; ctx.fillRect(-30,-30,60,35);
            ctx.fillStyle='#e74c3c';
            ctx.beginPath();ctx.moveTo(-35,-30);ctx.lineTo(0,-60);ctx.lineTo(35,-30);ctx.fill();
            ctx.fillStyle='#f1c40f'; ctx.fillRect(-6,-15,12,16);
        }else if(this.type==='FOUNTAIN'){
            ctx.fillStyle='#bdc3c7'; ctx.beginPath();ctx.ellipse(0,0,40,20,0,0,6.28);ctx.fill();
            ctx.fillStyle='#3498db'; ctx.beginPath();ctx.ellipse(0,0,34,14,0,0,6.28);ctx.fill();
        }else if(this.type==='CAMPFIRE'){
            ctx.strokeStyle='#5d4037'; ctx.lineWidth=4;
            ctx.beginPath();ctx.moveTo(-10,-5);ctx.lineTo(10,5);ctx.stroke();
            ctx.beginPath();ctx.moveTo(10,-5);ctx.lineTo(-10,5);ctx.stroke();
            ctx.fillStyle=`rgba(231,76,60,${0.7+Math.sin(gameTime*10)*0.3})`;
            ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(-6,0);ctx.lineTo(6,0);ctx.fill();
        }
        ctx.restore();
    }
}

// HUMAN & ENEMY
class Human extends Entity{
    constructor(x,y){
        super(x,y);
        this.hp=80; this.speed=90; this.angle=0; this.hitFlash=0;
        this.target=null; this.type=Math.random()<0.3?'ARCHER':'KNIGHT';
        this.cooldown=0;
    }
    update(dt){
        if(this.hitFlash>0)this.hitFlash-=dt*10;
        this.cooldown-=dt;
        let nest = entities.nests[0];
        if(nest && dist(this,nest)<300) this.target=nest;
        else this.target=player;
        const d = dist(this,this.target);
        this.angle = Math.atan2(this.target.y-this.y,this.target.x-this.x);
        const range = this.type==='ARCHER'?250:40;
        if(d>range){
            this.x+=Math.cos(this.angle)*this.speed*dt;
            this.y+=Math.sin(this.angle)*this.speed*dt;
        }else if(this.cooldown<=0){
            if(this.type==='ARCHER') entities.bullets.push(new Fireball(this.x,this.y,this.angle,this));
            else if(this.target===player) player.takeDamage(10);
            this.cooldown=2.0;
        }
    }
    takeDamage(dmg){
        this.hp-=dmg;this.hitFlash=1;
        if(this.hp<=0){
            this.remove=true;
            player.gainXp(100);
            entities.items.push(new Item(this.x,this.y,'MEAT'));
        }
    }
    draw(ctx){
        if(!isOnScreen(this))return;
        ctx.save();ctx.translate(this.x,this.y);
        this.drawShadow(ctx,20);
        if(Math.cos(this.angle)<0)ctx.scale(-1,1);
        ctx.fillStyle=this.hitFlash>0?'#fff':'#bdc3c7';
        ctx.beginPath();ctx.arc(0,-20,8,0,6.28);ctx.fill();
        ctx.fillRect(-8,-12,16,20);
        if(this.type==='ARCHER'){
            ctx.strokeStyle='#8e44ad';ctx.lineWidth=3;
            ctx.beginPath();ctx.arc(10,0,15,-1,1);ctx.stroke();
        }else{
            ctx.fillStyle='#f1c40f';
            ctx.fillRect(10,-10,5,25);
        }
        ctx.restore();
    }
}
class Enemy extends Entity{
    constructor(x,y,type){
        super(x,y);
        this.type=type;
        this.hp = type==='SLIME'?30:60;
        this.speed = type==='SLIME'?50:110;
        this.color = type==='SLIME'?'#2ecc71':'#e74c3c';
        this.damage=5; this.hitFlash=0; this.angle=0;
    }
    update(dt){
        if(this.hitFlash>0)this.hitFlash-=dt*10;
        const d = dist(this,player);
        if(d<400 && d>30){
            this.angle = Math.atan2(player.y-this.y,player.x-this.x);
            this.x+=Math.cos(this.angle)*this.speed*dt;
            this.y+=Math.sin(this.angle)*this.speed*dt;
        }
        if(d<40) player.takeDamage(this.damage*dt);
    }
    takeDamage(dmg){
        this.hp-=dmg;this.hitFlash=1;
        if(this.hp<=0){
            this.remove=true;
            player.gainXp(30);
            for(let i=0;i<8;i++)entities.particles.push(new Particle(this.x,this.y,this.color,0.8));
            if(Math.random()<0.3) entities.items.push(new Item(this.x,this.y,'MEAT'));
            limitParticles();
        }
    }
    draw(ctx){
        if(!isOnScreen(this))return;
        ctx.save();ctx.translate(this.x,this.y);
        this.drawShadow(ctx,20);
        if(this.type==='SLIME'){
            const b=Math.abs(Math.sin(gameTime*5))*10;
            ctx.translate(0,-b);
            ctx.fillStyle=this.hitFlash>0?'#fff':this.color;
            ctx.beginPath();ctx.arc(0,0,15,Math.PI,0);ctx.lineTo(15,10);ctx.lineTo(-15,10);ctx.fill();
        }else{
            if(Math.cos(this.angle)<0)ctx.scale(-1,1);
            ctx.translate(0,Math.sin(gameTime*10)*5);
            ctx.fillStyle=this.hitFlash>0?'#fff':this.color;
            ctx.beginPath();ctx.arc(0,-15,10,0,6.28);ctx.fill();
            ctx.fillRect(-10,-5,20,20);
        }
        ctx.restore();
    }
}

// NEST & BABY
class Nest extends Entity{
    constructor(x,y){super(x,y);this.hasEgg=false;this.p=0;}
    update(dt){
        if(this.hasEgg){
            const d = dist(this,player);
            this.p += (d<120?dt*18:dt*3);
            if(this.p>100){
                this.hasEgg=false;this.p=0;
                const baby = new BabyDragon(this.x+rand(-20,20),this.y+rand(-20,20));
                entities.babies.push(baby);
                const kidId = kidsRegistry.length+1;
                const kidName = `Kid ${kidId}`;
                kidsRegistry.push({
                    id:kidId,
                    name:kidName,
                    stage:'BABY',
                    affection:0,
                    entityRef:baby
                });
                showToast("아기 용이 태어났습니다!","🐣");
                for(let i=0;i<25;i++)entities.particles.push(new Particle(this.x,this.y,`hsl(${Math.random()*360},100%,60%)`,1));
                limitParticles();
                refreshKidsPanel();
            }
        }
    }
    draw(ctx){
        if(!isOnScreen(this))return;
        ctx.save();ctx.translate(this.x,this.y);
        ctx.fillStyle='#5d4037';ctx.beginPath();ctx.arc(0,0,42,0,6.28);ctx.fill();
        ctx.fillStyle='#8d6e63';ctx.beginPath();ctx.arc(0,0,32,0,6.28);ctx.fill();
        if(this.hasEgg){
            ctx.shadowBlur=15;ctx.shadowColor='#fff';
            ctx.fillStyle='#ecf0f1';
            ctx.beginPath();ctx.ellipse(0,-4,12,16,0,0,6.28);ctx.fill();
            ctx.shadowBlur=0;
            ctx.strokeStyle='#2ecc71';ctx.lineWidth=3;
            ctx.beginPath();ctx.arc(0,0,45,-1.57,-1.57+(6.28*this.p/100));ctx.stroke();
        }
        ctx.restore();
    }
}

class BabyDragon extends Entity{
    constructor(x,y){
        super(x,y);
        this.target=player;
        this.wing=0;
        this.growth=0; // 0~200
        this.stage='BABY'; // BABY, TEEN, ADULT
        this.atkTimer=0;
    }
    grow(){
        this.growth += 34;
        showToast("아기에게 고기를 먹였습니다!","🍖");
        for(let i=0;i<10;i++)entities.particles.push(new Particle(this.x,this.y,'#2ecc71',0.8));
        limitParticles();

        if(this.growth>=70 && this.stage==='BABY'){
            this.stage='TEEN';
            showToast("아기 용이 청소년이 되었습니다! (전투 가능)","🔥");
            const kid = kidsRegistry.find(k=>k.entityRef===this);
            if(kid) kid.stage='TEEN';
            refreshKidsPanel();
        }else if(this.growth>=140 && this.stage==='TEEN'){
            this.stage='ADULT';
            showToast("자식이 성체가 되었습니다! 더 이상 따라다니지 않습니다.","🐉");
            const kid = kidsRegistry.find(k=>k.entityRef===this);
            if(kid) kid.stage='ADULT';
            refreshKidsPanel();
        }
    }
    update(dt){
        let target = this.target;
        if(this.stage==='ADULT'){
            // 성체는 둥지 근처에서만 둥둥
            this.wing+=4*dt;
            return;
        }

        if(this.stage==='TEEN'){
            let enemy = entities.enemies.find(e=>dist(this,e)<280) || entities.humans.find(h=>dist(this,h)<280);
            if(enemy){
                target = enemy;
                this.atkTimer -= dt;
                if(this.atkTimer<=0){
                    entities.bullets.push(new Fireball(this.x,this.y,Math.atan2(enemy.y-this.y,enemy.x-this.x),player));
                    if(entities.bullets.length>100)entities.bullets.splice(0,entities.bullets.length-100);
                    this.atkTimer=1.6;
                }
            }else target = player;
        }

        let a = Math.atan2(target.y - this.y, target.x - this.x);
        const d = dist(this,target);
        const desiredDist = (this.stage==='TEEN' && target!==player)?150:70;
        if(d>desiredDist){
            this.x+=Math.cos(a)*190*dt;
            this.y+=Math.sin(a)*190*dt;
            this.wing+=20*dt;
        }else this.wing+=7*dt;
    }
    draw(ctx){
        if(!isOnScreen(this))return;
        ctx.save();ctx.translate(this.x,this.y);
        let s = this.stage==='TEEN'?0.8:(this.stage==='ADULT'?1.0:0.6);
        ctx.scale(s,s);
        const t = this.stage==='ADULT'?player:this.target;
        ctx.rotate(Math.atan2(t.y-this.y,t.x-this.x));
        this.drawShadow(ctx,20*s);
        let f=Math.sin(this.wing)*0.7;
        ctx.fillStyle=this.stage==='TEEN'?'#e67e22':(this.stage==='ADULT'?'#9b59b6':'#f1c40f');
        // 날개
        ctx.beginPath();ctx.moveTo(-5,0);ctx.quadraticCurveTo(-30,-20*(1+f),10,-8);ctx.fill();
        ctx.beginPath();ctx.moveTo(-5,0);ctx.quadraticCurveTo(-30,20*(1+f),10,8);ctx.fill();
        // 몸
        ctx.beginPath();ctx.ellipse(0,0,16,10,0,0,6.28);ctx.fill();
        // 머리
        ctx.beginPath();ctx.arc(18,0,8,0,6.28);ctx.fill();
        ctx.fillStyle='#000';
        ctx.beginPath();ctx.arc(20,-2,2,0,6.28);ctx.arc(20,2,2,0,6.28);ctx.fill();
        ctx.restore();
    }
}

// FIREBALL / PARTICLE / ITEM
class Fireball extends Entity{
    constructor(x,y,a,o){
        super(x,y);
        this.vx=Math.cos(a)*580;this.vy=Math.sin(a)*580;
        this.l=1.2;this.o=o;
    }
    update(dt){
        this.x+=this.vx*dt;this.y+=this.vy*dt;
        this.l-=dt;
        if(this.l<0)this.remove=true;
        if(Math.random()<0.25)entities.particles.push(new Particle(this.x,this.y,'#e67e22',0.4));
        limitParticles();
    }
    draw(ctx){
        if(!isOnScreen(this,50))return;
        ctx.save();ctx.translate(this.x,this.y);
        ctx.fillStyle='#f1c40f';ctx.shadowBlur=18;ctx.shadowColor='orange';
        ctx.beginPath();ctx.arc(0,0,7,0,6.28);ctx.fill();
        ctx.shadowBlur=0;ctx.restore();
    }
}
class Particle extends Entity{
    constructor(x,y,c,l=1){super(x,y);this.c=c;this.l=l;this.vx=(Math.random()-0.5)*90;this.vy=(Math.random()-0.5)*90;}
    update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.l-=dt;if(this.l<0)this.remove=true;}
    draw(ctx){
        if(this.l<=0)return;
        ctx.globalAlpha=this.l;
        ctx.fillStyle=this.c;
        ctx.beginPath();ctx.arc(this.x,this.y,3,0,6.28);ctx.fill();
        ctx.globalAlpha=1;
    }
}
class Item extends Entity{
    constructor(x,y,t){super(x,y);this.type=t;this.tm=0;}
    update(dt){this.tm+=dt*3;}
    draw(ctx){
        if(!isOnScreen(this))return;
        let yy=this.y+Math.sin(this.tm)*5;
        ctx.font='26px sans-serif';
        ctx.textAlign='center';
        ctx.fillText(this.type==='MEAT'?'🍖':'🥚',this.x,yy);
    }
}

let player;
let entities = {
    bullets:[], items:[], particles:[], nests:[], babies:[],
    props:[], npcs:[], enemies:[], humans:[]
};
let inputs = {keys:{},prevKeys:{}};
let currentNpc=null;

// DIALOGUE FUCTIONS
function startDialogue(npc,type){
    currentNpc = npc;
    isDialogueOpen = true;
    dOverlay.style.display='flex';
    dName.innerText = npc.config.name || '???';

    let scriptGroup;
    let scriptKey='intro';

    if(npc.config.role==='ELDER'){
        if(!elderTutorialDone && type==='TALK'){
            scriptGroup = NPC_SCRIPTS.TUTORIAL;
        }else{
            scriptGroup = NPC_SCRIPTS.WISE;
        }
    }else if(type==='FLIRT' && npc.config.canPartner){
        scriptGroup = NPC_SCRIPTS.FLIRT;
        if(npc.relation<30)scriptKey='low';
        else if(npc.relation<60)scriptKey='mid';
        else scriptKey='high';
    }else{
        scriptGroup = NPC_SCRIPTS[npc.config.personality] || NPC_SCRIPTS.WISE;
    }
    showDialogueNode(scriptGroup,scriptKey,npc);
}

function showDialogueNode(group,key,npc){
    const node = group[key];
    if(!node){ closeDialogue(); return; }
    dText.innerText = node.text;
    dOptions.innerHTML='';

    node.options.forEach(opt=>{
        const btn=document.createElement('button');
        btn.className='d-btn';
        btn.innerText=opt.t;
        btn.onclick=()=>{
            if(opt.eff !== 0 && currentNpc){
                currentNpc.relation = (currentNpc.relation||0)+opt.eff;
                showToast(opt.eff>0?"좋아했다!":"싫어했다...",opt.eff>0?"💖":"💔");
            }
            if(opt.next==='end'){
                if(group===NPC_SCRIPTS.TUTORIAL){
                    elderTutorialDone=true;
                    if(player){
                        player.inventory.meat+=3;
                        showToast("튜토리얼 보상: 고기 3개 획득!","🍖");
                        player.updateUI();
                    }
                }
                closeDialogue();
            }else if(opt.next==='meat'){
                if(player){
                    player.inventory.meat+=3;
                    showToast("고기 3개를 받았습니다!","🍖");
                    player.updateUI();
                }
                showDialogueNode(group,opt.next,npc);
            }else if(opt.next==='partner'){
                if(currentNpc){
                    currentNpc.state='PARTNER_FOLLOW';
                    playerPartner = currentNpc;
                    showToast(`${currentNpc.config.name}가 파트너가 되었습니다!`,"💕");
                    if(player)player.updateUI();
                }
                closeDialogue();
            }else{
                showDialogueNode(group,opt.next,npc);
            }
        };
        dOptions.appendChild(btn);
    });

    if(node.options.length===0){
        const btn=document.createElement('button');
        btn.className='d-btn';
        btn.innerText='닫기';
        btn.onclick=closeDialogue;
        dOptions.appendChild(btn);
    }
}
function closeDialogue(){
    isDialogueOpen=false;
    dOverlay.style.display='none';
    currentNpc=null;
}

// INIT
function spawnEnemy(){
    let x,y;
    do{
        x=rand(0,WORLD_SIZE);y=rand(0,WORLD_SIZE);
    }while(dist({x,y},{x:1200,y:1200})<700);
    const type = Math.random()<0.5?'SLIME':'GOBLIN';
    entities.enemies.push(new Enemy(x,y,type));
}
function spawnWanderingNPC(){
    const personalities=['WISE','BRAVE','PLAYFUL','GRUMPY'];
    const speciesList=['WESTERN','WYVERN','EASTERN'];
    let x,y;
    do{
        x=rand(0,WORLD_SIZE);y=rand(0,WORLD_SIZE);
    }while(getBiome(x,y)==='VILLAGE');
    const pers = personalities[Math.floor(Math.random()*personalities.length)];
    const spec = speciesList[Math.floor(Math.random()*speciesList.length)];
    const colors = randomDragonColors(spec);
    const namePool = ['Nara','Kirin','Raze','Mira','Dusk','Iro','Sora','Flint'];
    const name = namePool[Math.floor(Math.random()*namePool.length)];
    const npc = new Dragon(x,y,{
        name, personality:pers, species:spec, colors,
        canPartner:false
    },false);
    entities.npcs.push(npc);
}
function randomDragonColors(spec){
    if(spec==='EASTERN'){
        return {body:'#2ecc71',belly:'#27ae60',wing:'#16a085'};
    }else if(spec==='WYVERN'){
        return {body:'#2980b9',belly:'#3498db',wing:'#34495e'};
    }else if(spec==='BEHEMOTH'){
        return {body:'#8e44ad',belly:'#9b59b6',wing:'#8e44ad'};
    }else{
        return {body:'#e67e22',belly:'#f1c40f',wing:'#e74c3c'};
    }
}

function init(config){
    entities = {bullets:[],items:[],particles:[],nests:[],babies:[],props:[],npcs:[],enemies:[],humans:[]};

        name: config.name || 'Player',
        species: config.bodyType || config.species || 'WESTERN',

    },true);

    player.x=1200;player.y=1250;

    // TREES
    for(let i=0;i<280;i++){
        let x=rand(0,WORLD_SIZE),y=rand(0,WORLD_SIZE);
        if(dist({x,y},{x:1200,y:1200})>750) entities.props.push(new Prop(x,y,'TREE'));
    }
    // village deco
    entities.props.push(new Prop(1150,1100,'HOUSE'));
    entities.props.push(new Prop(1200,1200,'FOUNTAIN'));
    entities.props.push(new Prop(1250,1300,'CAMPFIRE'));

    entities.nests.push(nest);

    const elder = new Dragon(1200,1200,{
        name:'Elder',

    },false);

    // NPC fixed
    const tiamat = new Dragon(1300,1250,{
        name:'Tiamat',
        personality:'BRAVE',
        canPartner:true,
        species:'WYVERN',
        colors:{body:'#2980b9',belly:'#3498db',wing:'#34495e'}
    },false);
    tiamat.homeX=1300;tiamat.homeY=1250;

    const poco = new Dragon(1200,1300,{
        name:'Poco',
        personality:'PLAYFUL',
        canPartner:true,
        species:'WESTERN',
        colors:{body:'#e67e22',belly:'#f1c40f',wing:'#e67e22'}
    },false);
    poco.homeX=1200;poco.homeY=1300;

// RAID
function triggerRaid(){
    raidWarning.style.display='block';
    setTimeout(()=>raidWarning.style.display='none',3500);
    showToast("사냥꾼 습격이 시작되었습니다!","⚔️");
    for(let i=0;i<4;i++){
        entities.humans.push(new Human(800+rand(-80,80),1200+rand(-220,220)));
    }
}

// MAIN LOOP
function loop(now){
    if(!gameActive)return;
    const dt = Math.max(0,Math.min((now-lastTime)/1000,0.1));
    lastTime = now;

    if(!isDialogueOpen){
        gameTime += dt;
        raidTimer -= dt;
        if(raidTimer<=0){
            triggerRaid();
            raidTimer=180;
        }
    }

    cam.w=canvas.width;cam.h=canvas.height;
    cam.x += (player.x - cam.w/2 - cam.x)*0.1;
    cam.y += (player.y - cam.h/2 - cam.y)*0.1;
    cam.x = Math.max(-100,Math.min(WORLD_SIZE-cam.w+100,cam.x));
    cam.y = Math.max(-100,Math.min(WORLD_SIZE-cam.h+100,cam.y));

    ctx.fillStyle='#050505'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.save();
    ctx.translate(-cam.x,-cam.y);
    ctx.fillStyle = gCtx.createPattern(grassCanvas,'repeat');
    ctx.fillRect(cam.x,cam.y,cam.w,cam.h);

    // village tile (살짝 더 큰)
    ctx.fillStyle='#5d4037';
    ctx.fillRect(800,800,800,800);

    player.update(dt,inputs);
    player.draw(ctx);

    [...entities.props, ...entities.nests, ...entities.babies, ...entities.items, ...entities.npcs, ...entities.enemies, ...entities.humans].forEach(e=>{
        if(e.update && !isDialogueOpen) e.update(dt);
        e.draw(ctx);
    });

    entities.bullets.forEach(b=>{ if(!isDialogueOpen)b.update(dt); b.draw(ctx); });
    entities.particles.forEach(p=>{ if(!isDialogueOpen)p.update(dt); p.draw(ctx); });

    if(!isDialogueOpen){
        entities.bullets.forEach(b=>{
            if(b.remove)return;
            entities.enemies.forEach(e=>{ if(!e.remove && dist(b,e)<30){b.remove=true; e.takeDamage(10);} });
            entities.humans.forEach(h=>{ if(!h.remove && dist(b,h)<30){b.remove=true; h.takeDamage(10);} });
        });

        entities.bullets = entities.bullets.filter(e=>!e.remove);
        entities.enemies = entities.enemies.filter(e=>!e.remove);
        entities.humans = entities.humans.filter(e=>!e.remove);
        entities.items = entities.items.filter(e=>!e.remove);
        entities.particles = entities.particles.filter(e=>!e.remove);
        entities.babies = entities.babies.filter(e=>!e.remove);

        if(entities.enemies.length<10 && Math.random()<0.02) spawnEnemy();
        if(entities.particles.length>350)entities.particles.splice(0,entities.particles.length-350);
    }

    ctx.restore();
    inputs.prevKeys = {...inputs.keys};
    requestAnimationFrame(loop);
}

function limitParticles(){
    if(entities.particles.length>350)entities.particles.splice(0,entities.particles.length-350);
}

// KIDS PANEL
function refreshKidsPanel(){
    kidsCountSpan.innerText = kidsRegistry.length.toString();
    kidsList.innerHTML='';
    kidsRegistry.forEach(k=>{
        const row=document.createElement('div');
        row.className='kid-row';
        const left=document.createElement('div');
        left.innerHTML=`<strong>${k.name}</strong><div class="kid-stage">${k.stage}</div>`;
        const right=document.createElement('div');
        const hearts = Math.max(0,Math.round((k.affection||0)/20));
        right.innerHTML = `<span class="kid-heart">${'♥'.repeat(Math.min(3,hearts))}</span>`;
        row.appendChild(left);row.appendChild(right);
        kidsList.appendChild(row);
    });
}
function toggleKidsPanel(){
    if(kidsPanel.style.display==='flex'){
        kidsPanel.style.display='none';
    }else{
        refreshKidsPanel();
        kidsPanel.style.display='flex';
    }
}

// EVENTS
window.addEventListener('resize',()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
});
window.addEventListener('keydown',e=>{
    if(e.code==='Space')e.preventDefault();
    inputs.keys[e.key.toLowerCase()]=true;
});
window.addEventListener('keyup',e=>{
    inputs.keys[e.key.toLowerCase()]=false;
});

document.getElementById('start-btn').addEventListener('click',()=>{
    init({
        name: document.getElementById('c-name').value,
        bodyType: document.getElementById('c-type').value,
        colors: {
            body: document.getElementById('c-body').value,
            belly: document.getElementById('c-belly').value,
            wing: document.getElementById('c-wing').value
        }
    });
});

kidsToggleBtn.addEventListener('click',()=>{
    toggleKidsPanel();
});
kidsClose.addEventListener('click',()=>{
    kidsPanel.style.display='none';
});

// HUD collapse
hudCollapseBtn.addEventListener('click',()=>{
    hudPanel.classList.add('hud-collapsed');
    hudShowBtn.style.display='block';
});
hudShowBtn.addEventListener('click',()=>{
    hudPanel.classList.remove('hud-collapsed');
    hudShowBtn.style.display='none';
});
</script>
</body>
</html>
