<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragonia: The Origin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>

    <div id="customizer">
        <h1 class="title-logo">DRAGONIA</h1>
        <p class="subtitle">THE ORIGIN UPDATE</p>

        <div class="card">
            <input type="text" id="c-name" value="Bahamut" class="name-input">

            <div class="row">
                <span>Type</span>
                <select id="c-type">
                    <option value="WESTERN">Western (Classic)</option>
                    <option value="WYVERN">Wyvern (Speed)</option>
                    <option value="HYDRA">Hydra (Twin-headed)</option>
                    <option value="BEHEMOTH">Behemoth (Tank)</option>
                </select>
            </div>

            <div class="row"><span>Body Color</span> <input type="color" id="c-body" value="#c0392b"></div>
            
            <div class="row"><span>Accent Color (wings/belly)</span> <input type="color" id="c-wing" value="#e0a020"></div>

            <button class="start-btn" id="start-btn">AWAKEN</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="raid-warning">⚔️ RAID INBOUND ⚔️</div>
    <div id="interact-tip" class="interaction-prompt">💬 Talk (T)</div>

    <div id="ui-layer" style="display:none;">
        <div class="biome-badge"><span id="biome-text">Wild Forest</span></div>

        <button id="hud-show-btn">▶ HUD</button>

        <div class="hud-panel" id="hud-panel">
            <div class="hud-head">
                <div class="hud-icon">🐲</div>
                <div>
                    <div class="hud-name" id="ui-name">Player</div>
                    <div class="hud-lvl">LVL <span id="ui-lvl">1</span></div>
                    <div class="hud-partner">Partner: <span id="ui-partner">없음</span></div>
                </div>
            </div>

            <div class="stat-group">
                <div class="stat-header"><span>EXP</span> <span id="ui-xp-text">0%</span></div>
                <div class="progress-track"><div id="bar-xp" class="progress-fill xp-bar" style="width:0%"></div></div>
            </div>
            <div class="stat-group">
                <div class="stat-header"><span>HP</span> <span id="ui-hp-text">100</span></div>
                <div class="progress-track"><div id="bar-hp" class="progress-fill hp-bar" style="width:100%"></div></div>
            </div>
            <div class="stat-group">
                <div class="stat-header"><span>HUNGER</span></div>
                <div class="progress-track"><div id="bar-hunger" class="progress-fill hunger-bar" style="width:100%"></div></div>
            </div>

            <div class="inv-slot"><span>🍖 Meat:</span> <span id="ui-meat">0</span></div>

            <button id="kids-toggle-btn">🐣 애 관리 열기</button>
            <button id="hud-collapse-btn">◀ HUD 숨기기</button>
        </div>
    </div>

    <div id="kids-panel">
        <div id="kids-header">
            <div>🐣 애 관리</div>
            <button id="kids-close">닫기</button>
        </div>
        <div class="kids-meta">최대 자식 수: <span id="kids-max">6</span>명 / 현재: <span id="kids-count">0</span>명</div>
        <div id="kids-list"></div>
    </div>

    <div id="dialogue-overlay">
        <div id="d-header">
            <div id="d-portrait">🐉</div>
            <div id="d-name">NPC Name</div>
        </div>
        <div id="d-text"></div>
        <div id="d-options"></div>
    </div>

    <div class="controls-hint">
        <div><span class="key">WASD</span> 이동 • <span class="key">Shift</span> 달리기 • <span class="key">Space</span> 불꽃 • <span class="key">E</span> 줍기/먹기 • <span class="key">T</span> 말 걸기 • <span class="key">L</span> 플러팅</div>
        <div><span class="key">K</span> 애 관리 열기 • <span class="key">Esc</span> 대화 닫기</div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
